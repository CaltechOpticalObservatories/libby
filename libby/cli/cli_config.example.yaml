# Example libby CLI config.
#
# Copy this to ~/.libby/cli_config.yaml and edit as needed:
#   mkdir -p ~/.libby
#   cp <libby_pkg>/cli/cli_config.example.yaml ~/.libby/cli_config.yaml
#
# All keys are optional. Built-in defaults match what's shown here.
# Override per-call with --config / --transport / --rabbitmq-url flags.

transport: rabbitmq
rabbitmq_url: amqp://localhost

# ZMQ address book. Only consulted when transport=zmq; leave empty for
# RabbitMQ deployments. Each entry is peer_id: {endpoint, group_id} (a bare
# endpoint string is also accepted, with group_id defaulting to None), e.g.:
#   peers:
#     hsfei_pickoff:
#       endpoint: tcp://hispec.caltech.edu:5555
#       group_id: hsfei
peers: {}
