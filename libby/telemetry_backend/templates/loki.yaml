# Rendered from libby's telemetry backend; edits here are lost on the next install.

auth_enabled: false
server:
  http_listen_address: @query_bind@
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  # 9095 is Tempo's
  grpc_listen_port: 9096
common:
  instance_addr: 127.0.0.1
  path_prefix: @data@/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: @data@/loki/chunks
      rules_directory: @data@/loki/rules
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true
