[tox]
envlist = py312
skip_missing_interpreters = true
isolated_build = true

[testenv]
description = Run the test suite
extras =
deps =
commands =
    python -m unittest discover -s tests

[testenv:docs]
description = Build the Sphinx documentation (warnings fail the build)
extras = docs
commands =
    sphinx-build -b html -W --keep-going docs/source docs/build/html

[testenv:docs-live]
description = Build the docs and rebuild/reload on source changes
extras = docs
commands =
    sphinx-autobuild docs/source docs/build/html

[testenv:docs-clean]
description = Remove the built docs
skip_install = true
allowlist_externals = rm
commands =
    rm -rf docs/build
