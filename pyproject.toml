[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libby"
dynamic = ["version"]
description = "Libby: a tiny messaging library which uses bamboo with a ZMQ transport"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name="Prakriti Gupta", email="pgupta@caltech.edu" },
    { name="Jeb Bailey", email="jibailey@caltech.edu" },
    { name="Michael Langmayr", email="langmayr@caltech.edu" }
]
dependencies = [
  "pyzmq>=25.0.0",
  "pika>=1.3.0",
  "pyyaml>=6.0",
  "argcomplete>=3.0",
  "bamboo @ git+https://github.com/CaltechOpticalObservatories/bamboo.git@main"
]

[project.optional-dependencies]
influxdb = [
  "influxdb-client>=1.40",
]
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]
docs = [
  "sphinx>=7.2",
  "shibuya>=2024.1.21",
  "myst-parser>=2.0",
  "sphinx-autobuild>=2024.2.4",
]

[project.urls]
Homepage = "https://caltechopticalobservatories.github.io/libby/"
Repository = "https://github.com/CaltechOpticalObservatories/libby"
"Bug Tracker" = "https://github.com/CaltechOpticalObservatories/libby/issues"

# The version comes from the most recent libby-X.Y.Z git tag (see
# docs/source/releasing.md); untagged commits get X.Y.(Z+1).devN+g<sha>.
[tool.setuptools_scm]
tag_regex = "^libby-(?P<version>\\d+\\.\\d+\\.\\d+.*)$"
fallback_version = "0.0.0+unknown"

[tool.setuptools_scm.scm.git]
describe_command = "git describe --dirty --tags --long --match 'libby-*'"

[tool.setuptools.packages.find]
where = ["."]
include = ["libby", "libby.*"]
exclude = ["peers*", "package*"]

[tool.setuptools.package-data]
"libby.cli" = ["*.yaml"]
"libby.keyheader" = ["*.yaml"]
"libby.telemetry_backend" = ["templates/*"]

[project.scripts]
libby = "libby.cli.libby_cli:main"
keygrabber = "libby.keygrabber.main:main"
keyheader = "libby.keyheader.main:main"
