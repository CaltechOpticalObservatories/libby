name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "libby/**"
      - "pyproject.toml"
      - "tox.ini"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "libby/**"
      - "pyproject.toml"
      - "tox.ini"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tox
        run: pip install tox

      - name: Build docs
        run: tox -e docs

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    # Only publish from pushes to main, not from PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    # Scoped to this job rather than the workflow: only one deploy at a time,
    # never cancelling one already publishing, while PR builds stay parallel
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
